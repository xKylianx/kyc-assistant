<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#111827}.subtitle{font:600 18px Arial,sans-serif;fill:#475569}
    .h{font:700 20px Arial,sans-serif;fill:#fff}.sh{font:700 17px Arial,sans-serif;fill:#1f2937}
    .txt{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="52" text-anchor="middle" class="title">ARCHITECTURE KYC ASSISTANT — FLUX COMPLET</text>
<text x="800" y="82" text-anchor="middle" class="subtitle">UPLOAD → CHUNKS → AGENTS → REPORT</text>

<!-- columns -->
<g filter="url(#shadow)">
<rect x="25" y="120" width="290" height="650" rx="18" fill="#eef6ff" stroke="#3b82f6"/>
<rect x="335" y="120" width="290" height="650" rx="18" fill="#eefbf3" stroke="#22c55e"/>
<rect x="645" y="120" width="290" height="650" rx="18" fill="#eefbf3" stroke="#16a34a"/>
<rect x="955" y="120" width="290" height="650" rx="18" fill="#f5f0ff" stroke="#8b5cf6"/>
<rect x="1265" y="120" width="310" height="650" rx="18" fill="#fff7ed" stroke="#f97316"/>
</g>

<rect x="25" y="120" width="290" height="55" rx="18" fill="#2563eb"/><text x="170" y="155" text-anchor="middle" class="h">1 · UPLOAD</text>
<rect x="335" y="120" width="290" height="55" rx="18" fill="#16a34a"/><text x="480" y="155" text-anchor="middle" class="h">2 · PREP &amp; PROFILING</text>
<rect x="645" y="120" width="290" height="55" rx="18" fill="#15803d"/><text x="790" y="155" text-anchor="middle" class="h">3 · CHUNKS (DUCKDB)</text>
<rect x="955" y="120" width="290" height="55" rx="18" fill="#7c3aed"/><text x="1100" y="155" text-anchor="middle" class="h">4 · AGENTS D'ANALYSE</text>
<rect x="1265" y="120" width="310" height="55" rx="18" fill="#ea580c"/><text x="1420" y="155" text-anchor="middle" class="h">5 · REPORT</text>

<!-- upload -->
<rect x="50" y="205" width="240" height="105" rx="12" class="box"/><text x="170" y="238" text-anchor="middle" class="sh">Fichier CSV jusqu'à 1 GB+</text><text x="170" y="267" text-anchor="middle" class="txt">Upload streaming</text><text x="170" y="291" text-anchor="middle" class="small">blocs de 8 MiB</text>
<rect x="50" y="335" width="240" height="125" rx="12" class="box"/><text x="170" y="365" text-anchor="middle" class="sh">Sauvegarde sur disque</text><text x="170" y="397" text-anchor="middle" class="txt">Le fichier complet n'est</text><text x="170" y="420" text-anchor="middle" class="txt">jamais chargé en RAM</text>
<rect x="50" y="485" width="240" height="225" rx="12" class="box"/><text x="170" y="518" text-anchor="middle" class="sh">Réponse API</text><text x="70" y="552" class="txt">• file_id</text><text x="70" y="578" class="txt">• file_name</text><text x="70" y="604" class="txt">• file_path</text><text x="70" y="630" class="txt">• thread_id</text><text x="70" y="656" class="txt">• prep_state = uploaded</text>
<path d="M170 310 L170 335" class="arrow"/><path d="M170 460 L170 485" class="arrow"/>

<!-- prep -->
<rect x="360" y="205" width="240" height="255" rx="12" class="box"/><text x="480" y="237" text-anchor="middle" class="sh">Prep Agent · DuckDB</text><text x="380" y="273" class="txt">✓ format / encodage</text><text x="380" y="299" class="txt">✓ délimiteur</text><text x="380" y="325" class="txt">✓ nombre de lignes</text><text x="380" y="351" class="txt">✓ nombre de colonnes</text><text x="380" y="377" class="txt">✓ aperçu / profil</text><text x="380" y="403" class="txt">✓ colonnes KYC pertinentes</text><text x="380" y="429" class="txt">✓ détection Orange Money / pays</text>
<rect x="360" y="485" width="240" height="170" rx="12" class="box"/><text x="480" y="517" text-anchor="middle" class="sh">Prep State persistant</text><text x="380" y="553" class="txt">• métadonnées dataset</text><text x="380" y="579" class="txt">• colonnes détectées</text><text x="380" y="605" class="txt">• statut de préparation</text><text x="380" y="631" class="txt">• validations utilisateur</text>
<path d="M480 460 L480 485" class="arrow"/>

<!-- chunks -->
<rect x="670" y="205" width="240" height="230" rx="12" class="box"/><text x="790" y="237" text-anchor="middle" class="sh">Lecture par lots</text><text x="690" y="273" class="txt">Fichier CSV sur disque</text><text x="690" y="308" class="txt">Chunk 1 · lignes 1–50 000</text><text x="690" y="338" class="txt">Chunk 2 · 50 001–100 000</text><text x="690" y="368" class="txt">Chunk 3 · 100 001–150 000</text><text x="690" y="398" class="txt">… puis jusqu'au dernier lot</text>
<rect x="670" y="460" width="240" height="195" rx="12" class="box"/><text x="790" y="492" text-anchor="middle" class="sh">Filtrage des lignes actives</text><text x="690" y="528" class="txt">• colonne de statut</text><text x="690" y="554" class="txt">• valeurs actives</text><text x="690" y="580" class="txt">• seules les lignes actives</text><text x="690" y="606" class="txt">  sont analysées</text><text x="690" y="638" class="small">50 000 lignes par défaut, configurable</text>
<path d="M790 435 L790 460" class="arrow"/>

<!-- agents -->
<rect x="980" y="205" width="240" height="420" rx="12" class="box"/><text x="1100" y="237" text-anchor="middle" class="sh">Analysis Agent · par chunks</text>
<text x="995" y="272" class="txt">☎ MSISDN — format, pays</text>
<text x="995" y="310" class="txt">● Prénom — caractères</text>
<text x="995" y="348" class="txt">● Nom — caractères</text>
<text x="995" y="386" class="txt">▣ ID type — valeurs autorisées</text>
<text x="995" y="424" class="txt"># ID number — format</text>
<text x="995" y="462" class="txt">◷ DOB — format / cohérence</text>
<text x="995" y="500" class="txt">⌂ Ville — validité</text>
<text x="995" y="538" class="txt">⌖ Adresse — validité</text>
<text x="995" y="583" class="small">Résultats agrégés :</text><text x="995" y="605" class="small">scores, anomalies, conformité</text>
<rect x="980" y="650" width="240" height="80" rx="12" fill="#ede9fe" stroke="#8b5cf6"/><text x="1100" y="682" text-anchor="middle" class="sh">Persistence</text><text x="1100" y="708" text-anchor="middle" class="small">analysis_results + anomalies</text>

<!-- report -->
<rect x="1290" y="205" width="260" height="245" rx="12" class="box"/><text x="1420" y="237" text-anchor="middle" class="sh">Rapport KYC</text><text x="1310" y="273" class="txt">• score global / niveau de risque</text><text x="1310" y="301" class="txt">• lignes totales / actives</text><text x="1310" y="329" class="txt">• conformité par colonne</text><text x="1310" y="357" class="txt">• anomalies et criticité</text><text x="1310" y="385" class="txt">• métadonnées dataset</text><text x="1310" y="413" class="txt">• résumé exécutif / graphiques</text>
<rect x="1290" y="475" width="260" height="115" rx="12" class="box"/><text x="1420" y="508" text-anchor="middle" class="sh">Export</text><text x="1420" y="545" text-anchor="middle" class="txt">JSON · PDF</text><text x="1420" y="571" text-anchor="middle" class="small">rapport exploitable par le frontend</text>
<rect x="1290" y="615" width="260" height="115" rx="12" class="box"/><text x="1420" y="648" text-anchor="middle" class="sh">Persistence</text><text x="1420" y="680" text-anchor="middle" class="txt">reports</text><text x="1420" y="706" text-anchor="middle" class="small">historique / traçabilité</text>

<!-- cross-column arrows -->
<path d="M315 148 L335 148" class="arrow"/><path d="M625 148 L645 148" class="arrow"/><path d="M935 148 L955 148" class="arrow"/><path d="M1245 148 L1265 148" class="arrow"/>
<path d="M600 680 C760 800 900 800 980 730" class="arrow"/><path d="M1220 690 C1250 690 1260 690 1290 690" class="arrow"/>

<!-- footer -->
<rect x="25" y="805" width="1550" height="65" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="70" y="833" class="sh">Principes clés</text><text x="260" y="833" class="txt">Streaming upload 8 MiB</text><text x="510" y="833" class="txt">· DuckDB</text><text x="630" y="833" class="txt">· chunks 50k</text><text x="790" y="833" class="txt">· memory-bounded</text><text x="1010" y="833" class="txt">· agents indépendants</text><text x="1260" y="833" class="txt">· résultats persistés</text><text x="70" y="858" class="small">Objectif : traiter des CSV volumineux sans matérialiser le dataset complet en mémoire.</text>
</svg>